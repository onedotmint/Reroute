name: Rebuild workbench
on:
  push:
    branches: [rebuild/0.3-native]
    paths: [.github/workflows/rebuild-workbench.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble isolated development tools and reference source
        run: |
          set -eu
          mkdir -p /tmp/workbench/deps /tmp/workbench/refs
          git bundle create /tmp/workbench/repository.bundle --all
          cd /tmp/workbench/deps
          npm init -y >/dev/null
          npm install --save-exact --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@22 @clack/prompts shell-quote @types/shell-quote ignore @daytona/sdk e2b modal @earendil-works/pi-coding-agent
          cd /tmp/workbench/refs
          git clone --depth 1 https://github.com/earendil-works/pi.git pi
          git clone --depth 1 https://github.com/remote-cli/remote.git remote
          git clone --depth 1 --filter=blob:none --sparse https://github.com/skypilot-org/skypilot.git sky
          git -C sky sparse-checkout set sky/cli.py sky/client/sdk.py LICENSE --skip-checks
          for name in pi remote sky; do git -C "$name" rev-parse HEAD > "$name.commit"; rm -rf "$name/.git"; done
          cd /tmp/workbench
          tar -czf /tmp/reroute-workbench.tgz repository.bundle deps refs
      - uses: actions/upload-artifact@v4
        with:
          name: reroute-workbench
          path: /tmp/reroute-workbench.tgz
          retention-days: 2
          if-no-files-found: error
