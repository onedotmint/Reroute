name: Rebuild workbench
on:
  push:
    branches: [rebuild/0.3-native]
    paths: [.github/workflows/rebuild-workbench.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock dependencies on the authorized rebuild branch only
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/rebuild/0.3-native
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock native SDK and verification dependencies'
            git push origin HEAD:refs/heads/rebuild/0.3-native
          fi
      - name: Assemble offline verification tools (no cloud credentials)
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p /tmp/workbench/npm-cache
          cp "$(command -v node)" /tmp/workbench/node
          cp -a "$HOME/.npm/_cacache" /tmp/workbench/npm-cache/
          git bundle create /tmp/workbench/repository.bundle --all
          cp package-lock.json /tmp/workbench/package-lock.json
          tar -czf /tmp/reroute-workbench.tgz -C /tmp/workbench .
      - uses: actions/upload-artifact@v4
        with:
          name: reroute-workbench-node-cache
          path: /tmp/reroute-workbench.tgz
          retention-days: 2
          if-no-files-found: error
